services:
  - type: web
    name: pics-nigeria-api
    runtime: node
    repo: https://github.com/edurewards01-creator/pics-nigeria.git
    rootDir: .
    plan: starter
    buildCommand: npm install && npm run build:api
    startCommand: npm run start:render --workspace @pics-nigeria/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        value: PICS Nigeria Super Admin
