services:
  - type: web
    name: pics-nigeria-api
    runtime: node
    repo: https://github.com/masterzee001/bmo-deedoc.git
    rootDir: .
    plan: starter
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:render --workspace @pics-nigeria/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_ISSUER
        value: ogun-election-operations-api
      - key: JWT_AUDIENCE
        value: ogun-election-operations-web
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: API_JSON_BODY_LIMIT
        value: 1mb
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        value: PICS Nigeria Super Admin
