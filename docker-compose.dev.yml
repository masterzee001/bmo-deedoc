name: bmo-deedoc-development

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ogun_phase0_test
      POSTGRES_USER: ogun_test
      POSTGRES_PASSWORD: ogun_test_local_only
    ports:
      - "${OGUN_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogun_test -d ogun_phase0_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ogun-postgres-data:/var/lib/postgresql/data

volumes:
  ogun-postgres-data:
